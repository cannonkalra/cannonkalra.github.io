name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'  # Your pattern, e.g., semantic versions
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Install, build, and upload your site
        uses: withastro/action@v5
        with:
          # pnpm is auto-detected from the `packageManager` field in
          # package.json — do NOT also set `package-manager` here, or
          # pnpm/action-setup errors on the duplicate version.
          # The input is `build-cmd` (not `build-command`). `pnpm run build`
          # runs `astro build` + the Pagefind search index.
          build-cmd: pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4